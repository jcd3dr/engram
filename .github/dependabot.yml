version: 2

updates:
  # Go module dependencies
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "type:chore"
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "jcd3dr"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "type:chore"
    commit-message:
      prefix: "chore(ci)"
    reviewers:
      - "jcd3dr"

  # Docker image dependencies
  - package-ecosystem: "docker"
    directory: "/docker/cloud"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "type:chore"
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "jcd3dr"

  # Obsidian npm dependencies
  - package-ecosystem: "npm"
    directory: "/plugin/obsidian"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    labels:
      - "type:chore"
    commit-message:
      prefix: "chore(deps)"
